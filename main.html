<!DOCTYPE html>
<html>
<head>
    <title>Grid Calculator</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }

        .calculator {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        #display {
            width: 220px;
            height: 40px;
            margin-bottom: 10px;
            font-size: 20px;
            text-align: right;
            padding-right: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 55px);
            grid-gap: 10px;
        }

        button {
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #e0e0e0;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #d0d0d0;
        }

        .operator {
            background-color: #ff9500;
            color: white;
        }

        .operator:hover {
            background-color: #e08900;
        }

        .equal {
            background-color: #4caf50;
            color: white;
        }

        .equal:hover {
            background-color: #45a049;
        }

        .clear {
            background-color: #f44336;
            color: white;
        }

        .clear:hover {
            background-color: #da190b;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <input type="text" id="display" readonly>

        <div class="buttons">
            <button onclick="appendNumber(1)">1</button>
            <button onclick="appendNumber(2)">2</button>
            <button onclick="appendNumber(3)">3</button>
            <button class="operator" onclick="appendOperator('+')">+</button>

            <button onclick="appendNumber(4)">4</button>
            <button onclick="appendNumber(5)">5</button>
            <button onclick="appendNumber(6)">6</button>
            <button class="operator" onclick="appendOperator('-')">-</button>

            <button onclick="appendNumber(7)">7</button>
            <button onclick="appendNumber(8)">8</button>
            <button onclick="appendNumber(9)">9</button>
            <button class="operator" onclick="appendOperator('*')">*</button>

            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="appendNumber(0)">0</button>
            <button class="operator" onclick="appendOperator('/')">/</button>
            <button class="equal" onclick="calculateResult()">=</button>
        </div>
    </div>

    <script>
        let display = document.getElementById('display');
        let currentInput = '';

        // Append number to display
        function appendNumber(num) {
            currentInput += num;
            display.value = currentInput;
        }

        // Append operator
        function appendOperator(op) {
            if (currentInput === '') return; // Prevent starting with operator
            let lastChar = currentInput[currentInput.length - 1];
            if ("+-*/".includes(lastChar)) {
                // Replace last operator if user enters multiple
                currentInput = currentInput.slice(0, -1) + op;
            } else {
                currentInput += op;
            }
            display.value = currentInput;
        }

        // Clear display
        function clearDisplay() {
            currentInput = '';
            display.value = '';
        }

        // Calculate result
        function calculateResult() {
            try {
                let result = eval(currentInput); // Evaluate the expression
                display.value = result;
                currentInput = result.toString(); // Allow further calculations
            } catch (error) {
                display.value = 'Error';
                currentInput = '';
            }
        }
    </script>

</body>
</html>
